openapi: 3.1.0
info:
  title: Oval Hub API
  version: 0.1.0-draft
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Hub API (/api/v1), implemented by pulling from upstream REST APIs (the Hub stores no data), and the upstream
    AWS Oval Insights API (paths under /oval-insights are documentation-only; the real base URL is INSIGHTS_API_URL and the
    path starts at /v1). Only POST /api/v1/insights is built, as a temporary hold. Spec date 2026-10-08.
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: Session, pins and search
  description: 'Hub endpoints: session, pins and search.'
- name: Competitions
  description: 'Hub endpoints: competitions.'
- name: Teams
  description: 'Hub endpoints: teams.'
- name: Players
  description: 'Hub endpoints: players.'
- name: Referees
  description: 'Hub endpoints: referees.'
- name: Matches and live feed
  description: 'Hub endpoints: matches and live feed.'
- name: Events, video and playlists
  description: 'Hub endpoints: events, video and playlists.'
- name: Exports, files and reports
  description: 'Hub endpoints: exports, files and reports.'
- name: AI insights (Hub)
  description: 'Hub endpoints: ai insights (hub).'
- name: Oval Insights API
  description: Upstream AWS service, built by the AWS team. Not part of /api/v1.
paths:
  /api/v1/me:
    get:
      summary: The signed-in user, their club, role, home page and current season.
      operationId: get_me
      tags:
      - Session, pins and search
      description: 'Used by: Shell footer, Home (P1), every "my club" default (replaces hard-coded Harlequins).


        Access: Own data only (per user).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/me/pins:
    get:
      summary: The user's pinned pages, in sidebar order.
      operationId: get_me_pins
      tags:
      - Session, pins and search
      description: 'Used by: Sidebar Pinned list.


        Access: Own data only (per user).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pin'
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Pin a page.
      operationId: post_me_pins
      tags:
      - Session, pins and search
      description: 'Used by: Top-bar Pin button.


        Access: Own data only (per user).


        Max 20 pins per user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  pattern: ^/
                label:
                  type: string
                  maxLength: 80
              required:
              - path
              - label
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pin'
        '409':
          description: Path already pinned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Path not a Hub URL or label too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/me/pins/{pinId}:
    delete:
      summary: Unpin a page. Clears the home page if it was this pin.
      operationId: delete_me_pins_pinId
      tags:
      - Session, pins and search
      description: 'Used by: Top-bar Pin button.


        Access: Own data only (per user).'
      parameters:
      - name: pinId
        in: path
        required: true
        schema:
          type: string
        description: Pin ID.
      responses:
        '204':
          description: OK
        '404':
          description: No such pin for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/me/home:
    put:
      summary: Set or clear the page opened after sign-in.
      operationId: put_me_home
      tags:
      - Session, pins and search
      description: 'Used by: Pinned list "Set as home".


        Access: Own data only (per user).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type:
                  - string
                  - 'null'
              required:
              - path
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  homePath:
                    type:
                    - string
                    - 'null'
                required:
                - homePath
                additionalProperties: false
        '422':
          description: Path is not one of the user's pins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/search:
    get:
      summary: Find competitions, teams, players, referees and matches by name.
      operationId: get_search
      tags:
      - Session, pins and search
      description: 'Used by: Global search overlay (P4).


        Access: Any signed-in user.


        Target p95 under 150 ms. Backed by an upstream search endpoint, or by searching the upstream entity lists (cached
        5 min).'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
        description: Search text.
      - name: kinds
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated subset of competition,team,player,referee,match.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          default: 20
        description: Max results across groups.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/SearchResult'
                      required:
                      - kind
                      - items
                      additionalProperties: false
                required:
                - groups
                additionalProperties: false
        '422':
          description: q shorter than 2 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/competitions:
    get:
      summary: Competitions with data for a season.
      operationId: get_competitions
      tags:
      - Competitions
      description: 'Used by: Search seed.


        Access: Any signed-in user.'
      parameters:
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Competition'
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/competitions/{competitionId}:
    get:
      summary: Competition header and headline figures (points, tries, ball in play, with deltas).
      operationId: get_competitions_competitionId
      tags:
      - Competitions
      description: 'Used by: Competition header; Overview (P7).


        Access: Any signed-in user.'
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
        description: Competition ID, e.g. gallagher-prem.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competition'
        '404':
          description: Unknown competition or no data for season
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/competitions/{competitionId}/standings:
    get:
      summary: League table.
      operationId: get_competitions_competitionId_standings
      tags:
      - Competitions
      description: 'Used by: Home league table (P1, limit=6); Table tab (P9).


        Access: Any signed-in user.'
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
        description: Competition ID, e.g. gallagher-prem.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Top N rows.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StandingRow'
                required:
                - items
                additionalProperties: false
        '404':
          description: Unknown competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/competitions/{competitionId}/rounds:
    get:
      summary: Rounds for the round selector and filters.
      operationId: get_competitions_competitionId_rounds
      tags:
      - Competitions
      description: 'Used by: Overview round selector (P7); Fixture Card and Match Centre filters (P8, P14).


        Access: Any signed-in user.'
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
        description: Competition ID, e.g. gallagher-prem.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Round'
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/competitions/{competitionId}/trends:
    get:
      summary: Competition-wide trend measures.
      operationId: get_competitions_competitionId_trends
      tags:
      - Competitions
      description: 'Used by: League performance trend (P7); Stats tab (P11).


        Access: Any signed-in user.'
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
        description: Competition ID, e.g. gallagher-prem.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trend'
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/competitions/{competitionId}/team-rankings:
    get:
      summary: Every team ranked on one metric, against the competition average, plus the shape dials.
      operationId: get_competitions_competitionId_team-rankings
      tags:
      - Competitions
      description: 'Used by: Teams and Players tab, Teams section (P10).


        Access: Any signed-in user.'
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
        description: Competition ID, e.g. gallagher-prem.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      - name: metric
        in: query
        required: true
        schema:
          type: string
        description: Metric key, e.g. points_for, tackle_success.
      - name: agg
        in: query
        required: false
        schema:
          type: string
          enum:
          - total
          - average
        description: Default average.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    $ref: '#/components/schemas/Metric'
                  competitionAverage:
                    type:
                    - number
                    - 'null'
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        team:
                          $ref: '#/components/schemas/Ref'
                        value:
                          type:
                          - number
                          - 'null'
                      required:
                      - team
                      - value
                      additionalProperties: false
                  shape:
                    type: array
                    items:
                      $ref: '#/components/schemas/Metric'
                required:
                - metric
                - competitionAverage
                - items
                - shape
                additionalProperties: false
        '422':
          description: Unknown metric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/competitions/{competitionId}/player-leaders:
    get:
      summary: Top players per metric.
      operationId: get_competitions_competitionId_player-leaders
      tags:
      - Competitions
      description: 'Used by: Teams and Players tab, Players top 10s (P10).


        Access: Any signed-in user.'
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
        description: Competition ID, e.g. gallagher-prem.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      - name: metric
        in: query
        required: false
        schema:
          type: string
        description: Metric key, or all (default).
      - name: teamId
        in: query
        required: false
        schema:
          type: string
        description: Restrict to one team.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        metric:
                          $ref: '#/components/schemas/Metric'
                        leaders:
                          type: array
                          items:
                            type: object
                            properties:
                              player:
                                $ref: '#/components/schemas/Ref'
                              team:
                                $ref: '#/components/schemas/Ref'
                              value:
                                type:
                                - number
                                - 'null'
                            required:
                            - player
                            - team
                            - value
                            additionalProperties: false
                      required:
                      - metric
                      - leaders
                      additionalProperties: false
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams/{teamId}:
    get:
      summary: 'Team header: competition, position, record, coach, venue, form.'
      operationId: get_teams_teamId
      tags:
      - Teams
      description: 'Used by: Team header on every team tab.


        Access: Any signed-in user.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          description: Unknown team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams/{teamId}/next-fixture:
    get:
      summary: The team's next scheduled match and opponent.
      operationId: get_teams_teamId_next-fixture
      tags:
      - Teams
      description: 'Used by: Home Next match (P1); sidebar Next opponent; /next-opponent redirect (P2).


        Access: Any signed-in user.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    $ref: '#/components/schemas/MatchSummary'
                  opponent:
                    $ref: '#/components/schemas/Ref'
                  isHome:
                    type: boolean
                required:
                - match
                - opponent
                - isHome
                additionalProperties: false
        '404':
          description: No upcoming fixture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams/{teamId}/form:
    get:
      summary: Recent results with clip counts.
      operationId: get_teams_teamId_form
      tags:
      - Teams
      description: 'Used by: Overview Form guide and Recent results (P15).


        Access: Any signed-in user.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: last
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        match:
                          $ref: '#/components/schemas/MatchSummary'
                        result:
                          $ref: '#/components/schemas/ResultLetter'
                        clipCount:
                          type:
                          - integer
                          - 'null'
                      required:
                      - match
                      - result
                      - clipCount
                      additionalProperties: false
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams/{teamId}/season-stats:
    get:
      summary: Headline and performance measures, optionally with league averages.
      operationId: get_teams_teamId_season-stats
      tags:
      - Teams
      description: 'Used by: Home season strip (P1); Overview performance trend (P15); Stats tab (P21).


        Access: Any signed-in user.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      - name: competitionId
        in: query
        required: false
        schema:
          type: string
      - name: compare
        in: query
        required: false
        schema:
          type: string
          enum:
          - league
        description: Fill leagueValue on each tile.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  headline:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatTile'
                  performance:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatTile'
                required:
                - headline
                - performance
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams/{teamId}/season-stats/by-competition:
    get:
      summary: Season figures per competition, with which export formats exist.
      operationId: get_teams_teamId_season-stats_by-competition
      tags:
      - Teams
      description: 'Used by: Head-to-head Season data by competition (P17).


        Access: Any signed-in user.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        competition:
                          $ref: '#/components/schemas/Ref'
                        played:
                          type: integer
                        headline:
                          type: array
                          items:
                            $ref: '#/components/schemas/StatTile'
                        exports:
                          type: array
                          items:
                            type: object
                            properties:
                              format:
                                type: string
                                enum:
                                - csv
                                - xml
                                - pdf
                              available:
                                type: boolean
                            required:
                            - format
                            - available
                            additionalProperties: false
                      required:
                      - competition
                      - played
                      - headline
                      - exports
                      additionalProperties: false
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams/{teamId}/squad:
    get:
      summary: Squad with position groups.
      operationId: get_teams_teamId_squad
      tags:
      - Teams
      description: 'Used by: Squad roster (P18); Cohesion pitch (P19).


        Access: Any signed-in user.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: 'Season key, e.g. 2025-26. Default: current season.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SquadMember'
                required:
                - items
                additionalProperties: false
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams/{teamId}/lineup-history:
    get:
      summary: Shirt numbers per player across recent matches.
      operationId: get_teams_teamId_lineup-history
      tags:
      - Teams
      description: 'Used by: Squad lineup matrix (P18).


        Access: Any signed-in user.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: last
        in: query
        required: false
        schema:
          type: integer
          maximum: 12
          default: 6
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
