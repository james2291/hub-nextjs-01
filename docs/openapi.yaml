        Never fails the batch: per-item status ready | pending | unavailable | placeholder.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/InsightRequestItem'
                  minItems: 1
                  maxItems: 6
              required:
              - items
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InsightResult'
                  source:
                    type: string
                    enum:
                    - oval-insights-api
                    - placeholder
                required:
                - items
                - source
                additionalProperties: false
        '422':
          description: Bad item, e.g. malformed subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /oval-insights/v1/insights:
    get:
      summary: Read one stored AI insight.
      operationId: get_v1_insights
      tags:
      - Oval Insights API
      parameters:
      - name: subject
        in: query
        required: true
        schema:
          type: string
          pattern: ^(competition|team|player|referee):[A-Za-z0-9._-]{1,100}$
          examples:
          - team:harlequins
        description: kind:id, e.g. team:harlequins.
      - name: scope
        in: query
        required: true
        schema:
          type: string
          enum:
          - round
          - match
          - form
      - name: matchId
        in: query
        required: false
        schema:
          type: string
        description: Required when scope=match.
      - name: round
        in: query
        required: false
        schema:
          type: string
        description: Required when scope=round, e.g. Round 18.
      - name: window
        in: query
        required: false
        schema:
          type: string
        description: Required when scope=form, e.g. last-5.
      - name: season
        in: query
        required: true
        schema:
          type: string
      - name: perspective
        in: query
        required: true
        schema:
          type: string
          enum:
          - neutral
          - team
          - player
          - referee
      - name: sentences
        in: query
        required: false
        schema:
          type: string
          enum:
          - 2-3
          - 3-4
          - 3-5
        description: Preferred length; the service may ignore it for stored text.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvalInsight'
        '400':
          description: Missing or inconsistent parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing or wrong x-api-key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No insight generated yet for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Throttled by API Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      servers:
      - url: https://{insightsHost}
        variables:
          insightsHost:
            default: insights.example.com
      security:
      - insightsApiKey: []
      x-oval-owner: AWS team (Oval Insights API). Called only by the Hub server, never the browser.
  /oval-insights/v1/health:
    get:
      summary: Liveness and current model version.
      operationId: get_v1_health
      tags:
      - Oval Insights API
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  modelVersion:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - modelVersion
                additionalProperties: false
      servers:
      - url: https://{insightsHost}
        variables:
          insightsHost:
            default: insights.example.com
      security:
      - insightsApiKey: []
      x-oval-owner: AWS team (Oval Insights API). Called only by the Hub server, never the browser.
