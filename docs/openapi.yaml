                - type: object
                  properties:
                    layer:
                      const: heatmap
                    cols:
                      type: integer
                    rows:
                      type: integer
                    grid:
                      type: array
                      items:
                        type: array
                        items:
                          type: number
                  required:
                  - layer
                  - cols
                  - rows
                  - grid
                  additionalProperties: false
                - type: object
                  properties:
                    layer:
                      const: movement
                    paths:
                      type: array
                      items:
                        type: array
                        items:
                          type: array
                          items:
                            type: number
                  required:
                  - layer
                  - paths
                  additionalProperties: false
                - type: object
                  properties:
                    layer:
                      const: territory
                    zones:
                      type: array
                      items:
                        type: object
                        properties:
                          zone:
                            type: string
                          share:
                            type: number
                        required:
                        - zone
                        - share
                        additionalProperties: false
                  required:
                  - layer
                  - zones
                  additionalProperties: false
                - type: object
                  properties:
                    layer:
                      const: width
                    zones:
                      type: array
                      items:
                        type: object
                        properties:
                          zone:
                            type: string
                          share:
                            type: number
                        required:
                        - zone
                        - share
                        additionalProperties: false
                  required:
                  - layer
                  - zones
                  additionalProperties: false
        '404':
          description: No spatial data for this player or match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
