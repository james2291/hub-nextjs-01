                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: number
                          y:
                            type: number
                          type:
                            type: string
                          outcome:
                            type:
                            - string
                            - 'null'
                          eventId:
                            type: string
                        required:
                        - x
                        - y
                        - type
