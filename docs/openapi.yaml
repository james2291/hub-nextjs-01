  /api/v1/teams/{teamId}/selections/{matchId}:
    get:
      summary: The matchday 23 for a match (draft or published).
      operationId: get_teams_teamId_selections_matchId
      tags:
      - Teams
      description: 'Used by: Cohesion (P19).


        Access: Caller''s club only; other clubs get 404.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: matchId
        in: path
        required: true
        schema:
          type: string
        description: Stable match ID (UUID).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '404':
          description: No selection yet, or not the caller's club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: Save the draft selection. Creates it on first save.
      operationId: put_teams_teamId_selections_matchId
      tags:
      - Teams
      description: 'Used by: Cohesion autosave (P19), debounced 1 s.


        Access: Caller''s club only; other clubs get 404.


        Roles: coach, analyst.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
        description: Team ID, e.g. harlequins.
      - name: matchId
        in: path
        required: true
        schema:
          type: string
        description: Stable match ID (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slots:
                  type: array
                  items:
                    $ref: '#/components/schemas/SelectionSlot'
                  maxItems: 23
                version:
                  type: integer
                  description: Version you last read; 0 to create.
              required:
              - slots
              - version
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '409':
          description: 'Stale version: someone else saved first'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Player in two shirts, unknown player, or selection already published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
